<!DOCTYPE html>
<html>
<head>
    <title>Sales Portal – Login</title>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background-color: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }

        .logo {
            display: block;
            margin: 0 auto 20px auto;
            max-width: 150px;
            max-height: 80px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .request-access-btn {
            margin-top: 10px;
            background: #f3f4f6;
            color: #333;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        .request-access-btn:hover {
            background: #e5e7eb;
        }

        .link-btn {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: #667eea;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .link-btn:hover { text-decoration: underline; }

        .error {
            background-color: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .info-banner {
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .loading {
            text-align: center;
            color: #667eea;
            margin-top: 12px;
            display: none;
        }

        .help-text {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 20px;
        }

        #setupPanel { display: none; }
    </style>
</head>

<body>

<div class="login-container">
    <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">

    <h1>Sales Portal</h1>
    <p class="subtitle" id="subtitleText">Enter your email and password to continue</p>

    <div id="errorMessage" class="error"></div>
    <div id="infoMessage" class="info-banner"></div>

    <!-- ===================== LOGIN PANEL ===================== -->
    <div id="loginPanel">
        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
        <div class="form-group">
            <label>Email Address *</label>
            <input type="email" id="email" placeholder="your.email@company.com" autocomplete="email">
        </div>

        <div class="form-group">
            <label>Password *</label>
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
        </div>

        <button id="loginBtn" type="submit">Log In</button>
        </form>

        <button class="request-access-btn" onclick="window.location.href='request-access.html'">
            Request Access
        </button>

        <div class="loading" id="loadingMsg">Checking access…</div>
    </div>

    <!-- ============= FIRST-TIME PASSWORD SETUP PANEL ============= -->
    <div id="setupPanel">
        <form id="setupForm" onsubmit="event.preventDefault(); handleSetPassword();">
        <div class="form-group">
            <label>Create a Password *</label>
            <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label>Confirm Password *</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password">
        </div>

        <button id="setupBtn" type="submit">Set Password &amp; Log In</button>
        </form>
        <a class="link-btn" onclick="showLoginPanel()">← Back to login</a>
    </div>

    <p class="help-text">
        Access is limited to approved email addresses.
    </p>
</div>

<script>
    var AUTH_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyt75krYE3h9lJl-4uR7ymSmaf3sHPGSo8pOB5TlkUgkHFPGi-Z1FlHS6Jk850g2wxS/exec';
    var CLIENT_HASH_ITERATIONS = 1000; // sequential Web Crypto calls — fast enough (well under a second) to keep login snappy

    var pendingEmail = ''; // carried from login attempt into the setup panel

    // Auto-redirect if already authenticated
    $(document).ready(function () {
        var authData = sessionStorage.getItem('salesPortalAuth');
        if (authData) {
            try {
                JSON.parse(authData);
                window.location.href = 'index.html';
            } catch (e) {
                sessionStorage.removeItem('salesPortalAuth');
            }
        }
        if (!window.crypto || !window.crypto.subtle) {
            showError('This browser is missing required security features. Please use an up-to-date browser.');
            $('#loginBtn, #setupBtn').prop('disabled', true);
        }
    });

    // ==========================================================
    // Client-side salted, iterated SHA-256 — the password itself
    // never leaves the browser. Only this resulting hash travels
    // to the server, via a popup window (see below for why).
    // ==========================================================
    async function sha256Hex(str) {
        var enc = new TextEncoder().encode(str);
        var hashBuffer = await window.crypto.subtle.digest('SHA-256', enc);
        var hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    }
    async function hashPasswordClient(password, salt) {
        var value = salt + ':' + password;
        for (var i = 0; i < CLIENT_HASH_ITERATIONS; i++) {
            value = await sha256Hex(value);
        }
        return value;
    }
    function generateSalt() {
        var bytes = new Uint8Array(16);
        window.crypto.getRandomValues(bytes);
        return Array.from(bytes).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    }

    // ==========================================================
    // Popup + postMessage — fourth transport attempt, after three
    // confirmed dead ends (see password-auth-README.md for the full
    // story): plain CORS POST (blocked, no Access-Control-Allow-Origin),
    // iframe + postMessage (blocked, X-Frame-Options: SAMEORIGIN), and
    // GET+JSONP (blocked, ORB). A popup is neither an embedded frame nor
    // a subresource load, so none of those three restrictions apply to it.
    //
    // The popup must open SYNCHRONOUSLY, inside the click handler, before
    // any `await` — otherwise the browser no longer considers it tied to
    // a real user action and popup blockers kill it. It's then reused
    // (navigated more than once) across a login's two round-trips, since
    // navigating an *already-open* window isn't subject to that same
    // timing restriction — only opening a new one is.
    // ==========================================================
    function openAuthPopup() {
        return window.open('', 'authPopup_' + Date.now(), 'width=100,height=100,left=-2000,top=-2000');
    }

    function popupRequest(popup, params) {
        return new Promise(function (resolve) {
            var reqId = 'req_' + Date.now() + '_' + Math.random().toString(36).slice(2);
            var fullParams = Object.assign({}, params, { reqId: reqId });

            var timeoutId = setTimeout(function () {
                window.removeEventListener('message', listener);
                resolve(null);
            }, 15000);

            function listener(event) {
                var data = event.data;
                if (!data || typeof data !== 'object' || data.reqId !== reqId) return; // not our response
                clearTimeout(timeoutId);
                window.removeEventListener('message', listener);
                resolve(data);
            }
            window.addEventListener('message', listener);

            var query = Object.keys(fullParams).map(function (k) {
                return encodeURIComponent(k) + '=' + encodeURIComponent(fullParams[k]);
            }).join('&');
            popup.location.href = AUTH_SCRIPT_URL + '?' + query;
        });
    }

    function handleLogin() {
        var email = $('#email').val().trim();
        var password = $('#password').val();

        if (!email) { showError('Please enter your email address'); return; }
        var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) { showError('Please enter a valid email address'); return; }
        if (!password) { showError('Please enter your password'); return; }

        var popup = openAuthPopup(); // must happen here, synchronously — not inside runLoginFlow
        if (!popup) { showError('Please allow popups for this site to log in.'); return; }

        $('#loginBtn').prop('disabled', true).text('Checking…');
        $('#loadingMsg').show();
        hideMessages();

        runLoginFlow(email, password, popup);
    }

    async function runLoginFlow(email, password, popup) {
        var saltResponse = await popupRequest(popup, { action: 'getSalt', email: email });
        if (!saltResponse) { popup.close(); showError('Unable to reach authentication service'); resetLoginButton(); return; }

        if (saltResponse.needsSetup) {
            popup.close();
            pendingEmail = email;
            showInfo('No password set yet for this account. Create one below to continue.');
            showSetupPanel();
            resetLoginButton();
            return;
        }
        if (!saltResponse.success) { popup.close(); showError(saltResponse.message || 'Login failed'); resetLoginButton(); return; }

        var hash = await hashPasswordClient(password, saltResponse.salt);
        var loginResponse = await popupRequest(popup, { action: 'login', email: email, hash: hash });
        popup.close();

        if (loginResponse && loginResponse.success) {
            completeLogin(email, loginResponse);
        } else if (loginResponse && loginResponse.needsSetup) {
            pendingEmail = email;
            showInfo('No password set yet for this account. Create one below to continue.');
            showSetupPanel();
            resetLoginButton();
        } else if (loginResponse) {
            showError(loginResponse.message || 'Login failed');
            resetLoginButton();
        } else {
            showError('Unable to reach authentication service');
            resetLoginButton();
        }
    }

    function handleSetPassword() {
        var newPassword = $('#newPassword').val();
        var confirmPassword = $('#confirmPassword').val();

        if (!newPassword || newPassword.length < 8) { showError('Password must be at least 8 characters'); return; }
        if (newPassword !== confirmPassword) { showError('Passwords do not match'); return; }

        var popup = openAuthPopup();
        if (!popup) { showError('Please allow popups for this site to log in.'); return; }

        $('#setupBtn').prop('disabled', true).text('Setting up…');
        hideMessages();

        runSetupFlow(newPassword, popup);
    }

    async function runSetupFlow(newPassword, popup) {
        var salt = generateSalt();
        var hash = await hashPasswordClient(newPassword, salt);
        var response = await popupRequest(popup, { action: 'setPassword', email: pendingEmail, salt: salt, hash: hash });
        popup.close();

        if (response && response.success) {
            completeLogin(pendingEmail, response);
        } else if (response) {
            showError(response.message || 'Could not set password');
            $('#setupBtn').prop('disabled', false).text('Set Password & Log In');
        } else {
            showError('Unable to reach authentication service');
            $('#setupBtn').prop('disabled', false).text('Set Password & Log In');
        }
    }

    function completeLogin(email, response) {
        sessionStorage.setItem('salesPortalAuth', JSON.stringify({
            email: email,
            name: response.name || email.split('@')[0],
            repNumber: response.repNumber || '',
            role: response.role || 'User',
            programs: response.programs || [],
            timestamp: new Date().toISOString()
        }));
        window.location.href = 'index.html';
    }

    function showSetupPanel() {
        $('#loginPanel').hide();
        $('#setupPanel').show();
        $('#subtitleText').text('Set a password for ' + pendingEmail);
    }
    function showLoginPanel() {
        $('#setupPanel').hide();
        $('#loginPanel').show();
        $('#subtitleText').text('Enter your email and password to continue');
        hideMessages();
    }

    function showError(message) { $('#errorMessage').text(message).fadeIn(); $('#infoMessage').hide(); }
    function showInfo(message) { $('#infoMessage').text(message).fadeIn(); $('#errorMessage').hide(); }
    function hideMessages() { $('#errorMessage').hide(); $('#infoMessage').hide(); }

    function resetLoginButton() {
        $('#loginBtn').prop('disabled', false).text('Log In');
        $('#loadingMsg').hide();
    }
</script>

</body>
</html>
