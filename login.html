<!DOCTYPE html>
<html>
<head>
    <title>Sales Portal – Login</title>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background-color: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }

        .logo {
            display: block;
            margin: 0 auto 20px auto;
            max-width: 150px;
            max-height: 80px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .request-access-btn {
            margin-top: 10px;
            background: #f3f4f6;
            color: #333;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        .request-access-btn:hover {
            background: #e5e7eb;
        }

        .link-btn {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: #667eea;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .link-btn:hover { text-decoration: underline; }

        .error {
            background-color: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .info-banner {
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .loading {
            text-align: center;
            color: #667eea;
            margin-top: 12px;
            display: none;
        }

        .help-text {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 20px;
        }

        #setupPanel { display: none; }
    </style>
</head>

<body>

<div class="login-container">
    <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">

    <h1>Sales Portal</h1>
    <p class="subtitle" id="subtitleText">Enter your email and password to continue</p>

    <div id="errorMessage" class="error"></div>
    <div id="infoMessage" class="info-banner"></div>

    <!-- ===================== LOGIN PANEL ===================== -->
    <div id="loginPanel">
        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
        <div class="form-group">
            <label>Email Address *</label>
            <input type="email" id="email" placeholder="your.email@company.com" autocomplete="email">
        </div>

        <div class="form-group">
            <label>Password *</label>
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
        </div>

        <button id="loginBtn" type="submit">Log In</button>
        </form>

        <button class="request-access-btn" onclick="window.location.href='request-access.html'">
            Request Access
        </button>

        <div class="loading" id="loadingMsg">Checking access…</div>
    </div>

    <!-- ============= FIRST-TIME PASSWORD SETUP PANEL ============= -->
    <div id="setupPanel">
        <form id="setupForm" onsubmit="event.preventDefault(); handleSetPassword();">
        <div class="form-group">
            <label>Create a Password *</label>
            <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label>Confirm Password *</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password">
        </div>

        <button id="setupBtn" type="submit">Set Password &amp; Log In</button>
        </form>
        <a class="link-btn" onclick="showLoginPanel()">← Back to login</a>
    </div>

    <p class="help-text">
        Access is limited to approved email addresses.
    </p>
</div>

<script>
    // 🔁 Same deployment URL as before — just redeployed with the new
    // password-aware Auth.gs code (Deploy > Manage deployments > Edit > New version).
    var AUTH_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyt75krYE3h9lJl-4uR7ymSmaf3sHPGSo8pOB5TlkUgkHFPGi-Z1FlHS6Jk850g2wxS/exec';

    var pendingEmail = ''; // carried from login attempt into the setup panel

    // Auto-redirect if already authenticated
    $(document).ready(function () {
        var authData = sessionStorage.getItem('salesPortalAuth');
        if (authData) {
            try {
                JSON.parse(authData);
                window.location.href = 'index.html';
            } catch (e) {
                sessionStorage.removeItem('salesPortalAuth');
            }
        }
    });

    // ==========================================================
    // Posts to Auth.gs via a hidden iframe instead of $.ajax/fetch.
    // Apps Script's response to a cross-origin POST has no
    // Access-Control-Allow-Origin header, so XHR/fetch can never read
    // it. A form submitted into a hidden iframe isn't subject to CORS,
    // and Auth.gs's response posts the result back via postMessage.
    //
    // Matching is done by a unique request ID rather than comparing
    // window/frame references — Apps Script can serve its response
    // inside an extra Google-added wrapper frame, which makes strict
    // event.source checks unreliable. A single persistent listener
    // also cleanly ignores unrelated postMessage traffic (browser
    // extensions are a common, harmless source of it).
    // ==========================================================
    var pendingAuthRequests = {};

    window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || typeof data !== 'object' || !data.reqId) return; // not one of ours
        var pending = pendingAuthRequests[data.reqId];
        if (!pending) return;
        delete pendingAuthRequests[data.reqId];
        clearTimeout(pending.timeoutId);
        pending.cleanup();
        pending.onResult(data);
    });

    var authRequestCounter = 0;
    function postToAuth(action, email, password, onResult) {
        var reqId = 'req_' + Date.now() + '_' + (++authRequestCounter);
        var iframeName = 'authFrame_' + reqId;

        var iframe = document.createElement('iframe');
        iframe.name = iframeName;
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        var form = document.createElement('form');
        form.method = 'POST';
        form.action = AUTH_SCRIPT_URL;
        form.target = iframeName;
        form.style.display = 'none';

        function addField(name, value) {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = name;
            input.value = value;
            form.appendChild(input);
        }
        addField('action', action);
        addField('email', email);
        addField('reqId', reqId);
        if (password !== undefined && password !== null) addField('password', password);
        document.body.appendChild(form);

        function cleanup() {
            setTimeout(function () {
                if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
                if (form.parentNode) form.parentNode.removeChild(form);
            }, 500);
        }

        var timeoutId = setTimeout(function () {
            delete pendingAuthRequests[reqId];
            cleanup();
            onResult(null);
        }, 10000);

        pendingAuthRequests[reqId] = { onResult: onResult, timeoutId: timeoutId, cleanup: cleanup };

        form.submit();
    }

    function handleLogin() {
        var email = $('#email').val().trim();
        var password = $('#password').val();

        if (!email) { showError('Please enter your email address'); return; }
        var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) { showError('Please enter a valid email address'); return; }
        if (!password) { showError('Please enter your password'); return; }

        $('#loginBtn').prop('disabled', true).text('Checking…');
        $('#loadingMsg').show();
        hideMessages();

        postToAuth('login', email, password, function (response) {
            if (response && response.success) {
                completeLogin(email, response);
            } else if (response && response.needsSetup) {
                pendingEmail = email;
                showInfo('No password set yet for this account. Create one below to continue.');
                showSetupPanel();
                resetLoginButton();
            } else if (response) {
                showError(response.message || 'Login failed');
                resetLoginButton();
            } else {
                showError('Unable to reach authentication service');
                resetLoginButton();
            }
        });
    }

    function handleSetPassword() {
        var newPassword = $('#newPassword').val();
        var confirmPassword = $('#confirmPassword').val();

        if (!newPassword || newPassword.length < 8) { showError('Password must be at least 8 characters'); return; }
        if (newPassword !== confirmPassword) { showError('Passwords do not match'); return; }

        $('#setupBtn').prop('disabled', true).text('Setting up…');
        hideMessages();

        postToAuth('setPassword', pendingEmail, newPassword, function (response) {
            if (response && response.success) {
                completeLogin(pendingEmail, response);
            } else if (response) {
                showError(response.message || 'Could not set password');
                $('#setupBtn').prop('disabled', false).text('Set Password & Log In');
            } else {
                showError('Unable to reach authentication service');
                $('#setupBtn').prop('disabled', false).text('Set Password & Log In');
            }
        });
    }

    function completeLogin(email, response) {
        sessionStorage.setItem('salesPortalAuth', JSON.stringify({
            email: email,
            name: response.name || email.split('@')[0],
            repNumber: response.repNumber || '',
            role: response.role || 'User',
            programs: response.programs || [],
            timestamp: new Date().toISOString()
        }));
        window.location.href = 'index.html';
    }

    function showSetupPanel() {
        $('#loginPanel').hide();
        $('#setupPanel').show();
        $('#subtitleText').text('Set a password for ' + pendingEmail);
    }
    function showLoginPanel() {
        $('#setupPanel').hide();
        $('#loginPanel').show();
        $('#subtitleText').text('Enter your email and password to continue');
        hideMessages();
    }

    function showError(message) { $('#errorMessage').text(message).fadeIn(); $('#infoMessage').hide(); }
    function showInfo(message) { $('#infoMessage').text(message).fadeIn(); $('#errorMessage').hide(); }
    function hideMessages() { $('#errorMessage').hide(); $('#infoMessage').hide(); }

    function resetLoginButton() {
        $('#loginBtn').prop('disabled', false).text('Log In');
        $('#loadingMsg').hide();
    }
</script>

</body>
</html>
