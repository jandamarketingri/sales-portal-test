<!DOCTYPE html>
<html>
<head>
    <title>Sales Portal – Set Your Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background-color: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
            box-sizing: border-box;
        }
        .logo { display: block; margin: 0 auto 20px auto; max-width: 150px; max-height: 80px; }
        h1 { text-align: center; color: #333; margin: 0 0 10px; font-size: 26px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 26px; font-size: 14px; line-height: 1.45; }
        .subtitle b { color: #333; word-break: break-all; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; }
        input {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 14px; box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #667eea; }
        .show-pw { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #555; font-weight: normal; margin: -8px 0 20px; cursor: pointer; }
        .show-pw input { width: auto; margin: 0; }
        button {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 6px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: opacity 0.3s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .link-btn {
            display: block; text-align: center; margin-top: 16px; color: #667eea;
            font-size: 13px; font-weight: 600; text-decoration: none;
        }
        .link-btn:hover { text-decoration: underline; }
        .error {
            background-color: #ffebee; color: #c62828; padding: 12px; border-radius: 6px;
            margin-bottom: 20px; text-align: center; display: none; font-size: 14px; line-height: 1.4;
        }
        .loading { text-align: center; color: #667eea; padding: 20px 0; }
        #formPanel { display: none; }
    </style>
</head>

<body>
<div class="login-container">
    <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
    <h1 id="title">Set Your Password</h1>
    <p class="subtitle" id="subtitle"></p>

    <div id="errorMessage" class="error"></div>
    <div id="loadingMsg" class="loading">Checking your link…</div>

    <div id="formPanel">
        <form onsubmit="event.preventDefault(); savePassword();">
            <!-- Lets password managers save the new password under the right email -->
            <input type="email" id="username" autocomplete="username" style="display:none;">
            <div class="form-group">
                <label>New Password *</label>
                <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>Type It Again *</label>
                <input type="password" id="confirmPassword" placeholder="Same password again" autocomplete="new-password">
            </div>
            <label class="show-pw"><input type="checkbox" id="showPw"> Show password</label>
            <button id="saveBtn" type="submit">Save Password &amp; Log In</button>
        </form>
    </div>

    <a class="link-btn" href="login.html">← Back to login</a>
</div>

<script>
    var RELAY_URL = 'https://blue-silence-0a95.will1298.workers.dev';
    var CLIENT_HASH_ITERATIONS = 1000;   // must match login.html
    var linkEmail = '';

    // The link's token: taken from the address bar, then removed from it (so it
    // isn't left in the browser history). Kept for this tab in case of a refresh.
    var token = (function () {
        var t = new URLSearchParams(location.search).get('t') || '';
        try {
            if (t) sessionStorage.setItem('pwLinkToken', t);
            else t = sessionStorage.getItem('pwLinkToken') || '';
        } catch (e) {}
        if (location.search) history.replaceState(null, '', location.pathname);
        return t;
    })();

    function callAuth(params) {
        var query = Object.keys(params).map(function (k) {
            return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
        }).join('&');
        var ctrl = window.AbortController ? new AbortController() : null;
        var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 30000) : null;
        return fetch(RELAY_URL + '?' + query, ctrl ? { signal: ctrl.signal } : {})
            .then(function (res) { return res.json(); })
            .catch(function () { return null; })
            .finally(function () { if (timer) clearTimeout(timer); });
    }

    // Same salted, iterated SHA-256 as login.html: the password never leaves the browser.
    async function sha256Hex(str) {
        var buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    }
    async function hashPasswordClient(password, salt) {
        var value = salt + ':' + password;
        for (var i = 0; i < CLIENT_HASH_ITERATIONS; i++) value = await sha256Hex(value);
        return value;
    }
    function generateSalt() {
        var bytes = new Uint8Array(16);
        window.crypto.getRandomValues(bytes);
        return Array.from(bytes).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    }

    function showError(msg) { $('#errorMessage').text(msg).show(); }
    function deadLink(msg) {
        $('#loadingMsg, #formPanel').hide();
        $('#title').text('Link Not Working');
        $('#subtitle').text('');
        showError(msg);
        try { sessionStorage.removeItem('pwLinkToken'); } catch (e) {}
    }

    $(async function () {
        if (!window.crypto || !window.crypto.subtle) { deadLink('This browser is missing required security features. Please use an up-to-date browser.'); return; }
        if (!token) { deadLink('This link is incomplete. Open the link from your email again, or go back to the login page and choose “Forgot your password?”.'); return; }
        var r = await callAuth({ action: 'checkPasswordLink', t: token });
        if (!r) { $('#loadingMsg').hide(); showError('We couldn’t reach the server. Please refresh this page in a moment.'); return; }
        if (!r.success) { deadLink(r.message); return; }

        linkEmail = r.email;
        var first = (r.name || '').split(/\s+/)[0];
        if (r.kind === 'invite') {
            $('#title').text('Welcome' + (first ? ', ' + first : '') + '!');
            $('#subtitle').html('Choose a password for <b></b>. You’ll use it with this email address to log in.').find('b').text(r.email);
        } else {
            $('#title').text('Set a New Password');
            $('#subtitle').html('Choose a new password for <b></b>.').find('b').text(r.email);
        }
        $('#username').val(r.email);
        $('#loadingMsg').hide();
        $('#formPanel').show();
        $('#newPassword').focus();
    });

    $('#showPw').on('change', function () { $('#newPassword, #confirmPassword').attr('type', this.checked ? 'text' : 'password'); });

    async function savePassword() {
        var pw = $('#newPassword').val(), pw2 = $('#confirmPassword').val();
        $('#errorMessage').hide();
        if (!pw || pw.length < 8) { showError('Your password needs at least 8 characters.'); return; }
        if (pw !== pw2) { showError('The two passwords don’t match. Please type them again.'); return; }

        $('#saveBtn').prop('disabled', true).text('Saving…');
        var salt = generateSalt();
        var r = await callAuth({ action: 'resetPassword', t: token, salt: salt, hash: await hashPasswordClient(pw, salt) });
        if (!r) { showError('We couldn’t reach the server. Please try again.'); $('#saveBtn').prop('disabled', false).text('Save Password & Log In'); return; }
        if (!r.success) { deadLink(r.message || 'Something went wrong.'); return; }

        try {
            sessionStorage.removeItem('pwLinkToken');
            localStorage.setItem('portalSalt:' + linkEmail, salt);   // same as login.html, so next login is one step
        } catch (e) {}
        sessionStorage.setItem('salesPortalAuth', JSON.stringify({
            email: linkEmail,
            name: r.name || linkEmail.split('@')[0],
            repNumber: r.repNumber || '',
            role: r.role || 'User',
            programs: r.programs || [],
            token: r.token || '',
            timestamp: new Date().toISOString()
        }));
        $('#saveBtn').text('Saved! Logging you in…');
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
