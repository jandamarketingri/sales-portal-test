<!DOCTYPE html>
<html>
<head>
    <title>NEXCOM - Sales Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 800px;
            width: 90%;
            position: relative;
        }
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            max-width: 90px;
            max-height: 70px;
            object-fit: contain;
        }
        .switch-program {
            display: block;
            text-align: center;
            color: #764ba2;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .switch-program:hover { text-decoration: underline; }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            margin-top: 50px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 18px;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .nav-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }
        .nav-card h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        .nav-card p {
            margin: 0;
            opacity: 0.9;
            font-size: 14px;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .coming-soon-badge {
            display: inline-block;
            background: rgba(255,255,255,0.25);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            margin-top: 8px;
            font-weight: 700;
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="nex-logo.jpg" alt="Navy Exchange Logo" class="logo">
    <a href="index.html" class="switch-program" style="position:absolute; top:28px; right:30px;">⇄ Switch Program</a>
    <h1>NEXCOM</h1>
    <p class="subtitle">Select a catalog to get started</p>

    <div class="nav-grid">
        <a href="souvenirs.html" class="nav-card">
            <div class="icon">🛍️</div>
            <h2>Souvenirs</h2>
            <p>Custom-print tees, hardgoods &amp; accessories</p>
        </a>

        <a href="navy-pride.html" class="nav-card">
            <div class="icon">⚓</div>
            <h2>Local Navy Pride</h2>
            <p>Custom-print tees, hardgoods &amp; accessories</p>
        </a>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
$(document).ready(function(){
    var authData = sessionStorage.getItem('salesPortalAuth');

    if(!authData){
        window.location.href = 'login.html';
        return;
    }

    try {
        var auth = JSON.parse(authData);

        var userInfo = '<div style="position:fixed;top:20px;right:20px;background:white;padding:10px 20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.2);display:flex;gap:10px;align-items:center;z-index:1000;">' +
            '<span style="color:#666;font-size:14px;">👤 ' + auth.name + '</span>' +
            '<a href="help.html" style="background:#28a745;color:white;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:600;text-decoration:none;font-size:14px;">🆘 Need Help</a>' +
            '<a href="my-orders.html" style="background:#667eea;color:white;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:600;text-decoration:none;font-size:14px;">📋 My Orders</a>' +
            '<button onclick="logout()" style="background:#dc3545;color:white;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:600;">Logout</button>' +
            '</div>';

        $('body').append(userInfo);

    } catch(e){
        sessionStorage.removeItem('salesPortalAuth');
        window.location.href = 'login.html';
    }
});

function logout() {
    if(confirm('Are you sure you want to log out?')){
        sessionStorage.removeItem('salesPortalAuth');
        window.location.href = 'login.html';
    }
}
</script>

</body>
</html>
